# Phase-12 ADVISORY AI jobs (ADR 0048 PR review, 0051 story-matrix hints, 0052 semantic
# a11y, 0056 security Layer 2, 0050 changelog). Every job here is ADVISORY — it posts a
# comment and never sets a required-check status (ADR 0046/0047). Provider-agnostic via the
# OpenAI-compatible client (ADR 0075). The whole workflow is INERT until a 👤 provisions the
# AI_API_KEY secret (ADR 0046/0044): the `guard` job reads whether the secret is non-empty
# WITHOUT exposing it, and the AI jobs are skipped while it is absent — so this lands dormant
# and self-activates on the day the key is added, exactly like the Chromatic token.
name: AI advisory (Phase 12)

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege: read the repo, comment on the PR. No other write path.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-advisory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # secrets.* cannot be used directly in `if:`, so surface a boolean output instead.
  guard:
    name: Has AI_API_KEY?
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.k.outputs.has_key }}
    steps:
      - id: k
        run: echo "has_key=${{ secrets.AI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  review:
    name: AI review + security L2 (advisory)
    needs: guard
    if: needs.guard.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: AI PR review (ADR 0048 / 0051 / 0052)
        run: node scripts/ai/pr-review.mjs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          # Provider via repo Variables (Settings → Secrets and variables → Actions → Variables).
          # AI_BASE_URL = an OpenAI-compatible base (Gemini example in .env.example);
          # AI_MODEL = the provider's model id (e.g. gemini-2.5-flash). ADR 0075.
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_BASE: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: AI security review — Layer 2 (ADR 0056)
        run: node scripts/ai/security-review.mjs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DIFF_BASE: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changelog:
    name: AI changelog draft (dev→main, advisory)
    needs: guard
    if: needs.guard.outputs.has_key == 'true' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Draft changelog (ADR 0050 — posted as an advisory comment, human edits in the release PR)
        run: node scripts/ai/changelog.mjs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          CHANGELOG_RANGE: origin/main..HEAD
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

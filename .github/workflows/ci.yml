# CI quality gate — ADR 0010. Runs the same commands as the local gate, so
# green-local means green-CI. Deployment is not CI's job: Vercel owns preview
# and production deploys (ADR 0009). Action versions are pinned to commit SHAs
# per the ADR 0044 pinning posture (reaffirmed by ADR 0056 for the scanner).
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    # `labeled` / `unlabeled` re-run the gate when the `hotfix` label is
    # toggled, so the ADR 0008 coverage bypass is re-evaluated immediately.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least-privilege default: every job reads the repo, nothing more.
permissions:
  contents: read

# Note: toggling the `hotfix` label cancels the in-flight PR run and starts a
# fresh one — required checks are satisfied by the latest run, by design.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # ADR 0008: only a `hotfix/*` branch or a `hotfix`-labeled PR bypasses
      # the coverage threshold — and nothing else of the gate. Tests still run.
      HOTFIX: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'hotfix/') || contains(github.event.pull_request.labels.*.name, 'hotfix')) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 24 from .nvmrc (ADR 0004)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ADR 0034→0037/0036/0040: the Storybook stories-as-tests project runs in Vitest
      # browser mode, so `test:coverage` needs a Playwright browser. (This is the only
      # engine the coverage gate depends on; the test-runner SMOKE job stays local-only
      # during bootstrap — see the note at the foot of this file.)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Dependency vulnerabilities — npm audit (high+, production) (ADR 0069)
        run: npm audit --audit-level=high --omit=dev

      - name: Dependency licenses — permissive allowlist (ADR 0071)
        run: npm run check:licenses

      - name: Spelling — documentation (ADR 0074)
        run: npm run check:spelling

      - name: Component stories exist (ADR 0042)
        run: npm run check:stories

      - name: Module boundaries — dependency-cruiser (ADR 0060)
        run: npm run check:boundaries

      - name: FSD layer boundaries — Steiger (ADR 0065/0066)
        run: npm run check:fsd

      - name: Composition graph ↔ import reconciliation (ADR 0059/0060)
        run: npm run check:graph

      - name: design-intent fitness functions — api↔props, state coverage, states↔stories (ADR 0062)
        run: npm run check:design-intent

      - name: Figma drift seals — shape + presence (ADR 0063; inert until a Figma file is wired)
        run: npm run check:seals

      - name: i18n key parity + ICU (ADR 0055)
        run: npm run check:i18n

      - name: Gate self-test — each custom rule rejects its violator (ADR 0058/0060/0059/0055, P6)
        run: npm run check:gates

      - name: Token drift — gen:tokens output matches globals.css (ADR 0058)
        run: |
          npm run gen:tokens
          git diff --exit-code -- src/design-system/tokens.generated.ts src/design-system/tokens.allowlist.json src/design-system/tokens.agent-rules.md

      - name: Build
        run: npm run build

      - name: Test with coverage gate (≥80%, ADR 0008)
        if: env.HOTFIX != 'true'
        run: npm run test:coverage

      - name: Test without coverage threshold (hotfix bypass, ADR 0008)
        if: env.HOTFIX == 'true'
        run: npm run test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API on pull_request
      # events; still read-only — no write path anywhere in this job.
      pull-requests: read
    steps:
      - name: Checkout full history (incoming commits are scanned, ADR 0056)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: gitleaks — blocking secret scan (ADR 0056 Layer 1)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Committed, human-reviewed allowlist (ADR 0056, 0046).
          GITLEAKS_CONFIG: .gitleaks.toml
          # Least-privilege: no PR-comment write path — the red check plus the
          # job summary are the signal.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ── Claude-infrastructure integrity ─────────────────────────────────────────
  # Applies the project's own drift-prevention discipline (single source + gates
  # that test themselves, AI-GUARDRAILS.md §7) to the surfaces that hard-code ~200
  # ADR numbers and dozens of npm-script / scripts/* references but had no upstream
  # guard: the `.claude/` tree (check:claude), CLAUDE.md (check:claude-md), and the
  # operative CI/env surfaces that cite ADRs (check:citations — this file + .env.example).
  # Dependency-free Node scripts — no node_modules needed — so this job skips `npm ci`
  # and runs in parallel with the quality gate.
  #
  # GOVERNANCE: these reference-integrity gates are recorded by ADR 0067 (proposed) and
  # extend the ADR 0054 drift-audit posture; while 0067 is proposed keep them advisory —
  # accept it before marking any of them a required check (a 👤 branch-protection setting).
  claude-infra:
    name: Claude-infra integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node 24 from .nvmrc (ADR 0004)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Gate self-test — check:claude rejects its own violators (P6, the check:gates pattern)
        run: npm run check:claude -- --self-test

      - name: Skill/agent/command references resolve — skill-drift gate (extends ADR 0054)
        run: npm run check:claude

      - name: CLAUDE.md ↔ accepted-ADR citation reconciliation (ADR 0001 accepted-only rule)
        run: npm run check:claude-md

      - name: Citation self-test — check:citations rejects its own violators (P6)
        run: npm run check:citations -- --self-test

      - name: ADR/CON citations resolve in CI + env surfaces (ADR 0067)
        run: npm run check:citations

      - name: Action-pin self-test — check:action-pins rejects its own violators (P6)
        run: npm run check:action-pins -- --self-test

      - name: GitHub Actions are SHA-pinned (ADR 0044/0070)
        run: npm run check:action-pins

      - name: Technical-debt escape-hatch inventory (ADR 0003/0029/0039/0049/0062/0064)
        run: npm run debt:scan

  # ── Conventional Commits ─────────────────────────────────────────────────────
  # commitlint over the PR's commit range (ADR 0072) — the format the AI changelog draft
  # (0050) assumes. Merge commits are ignored by config-conventional; squash-merge title
  # enforcement is a separate 👤 branch-protection setting.
  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node 24 from .nvmrc (ADR 0004)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: commitlint — Conventional Commits over the PR range (ADR 0072)
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ── e2e job: temporarily removed during bootstrap (2026-06-11) ──────────────
  # ADR 0007/0010 put the Playwright e2e in the CI gate, and a full working job
  # existed here (Supabase stack startup → migration replay → gen:types drift
  # check → auth/RLS e2e). It was removed for now because the Supabase image
  # pulls (~3–4 min/run) dominate CI turnaround during bootstrap while there are
  # no real feature components yet. This is a deliberate, temporary deviation
  # tracked in docs/bootstrap-plan.md, NOT an ADR change — e2e-in-CI remains the
  # target end-state.
  #
  # The specs still run locally on every change: `npm run test:e2e` (needs a
  # local Supabase stack: `npx supabase start`).
  #
  # Re-enable before the first dev→main production promotion (ADR 0011): recover
  # the exact job from this PR's git history (feat/phase-7-supabase, the commits
  # before this removal) — it is correct and CI-verified up to the e2e step.

  # ── Storybook test-runner smoke: local-only during bootstrap (Phase 10) ─────
  # ADR 0037 puts a `@storybook/test-runner` smoke pass over the *statically built*
  # Storybook in CI (storybook build → serve → render + play, no axe, no coverage).
  # It is deferred from CI for now — same lean-bootstrap rationale as the e2e job:
  # it adds a Storybook build + serve + a second browser run, while the Vitest addon
  # (browser-mode story tests + a11y + merged coverage, ADR 0037/0039/0041) already runs in
  # the quality gate above and is the load-bearing engine. This is a deliberate,
  # temporary deviation tracked in docs/bootstrap-plan.md, NOT an ADR change.
  #
  # It runs LOCALLY on demand: `npm run build-storybook`, serve `storybook-static`
  # (or `npm run storybook`), then `npm run test:storybook`.
  #
  # Re-enable with the e2e job before the first dev→main production promotion.

# Visual-regression gate — ADR 0043. Publishes the built Storybook to Chromatic
# and snapshots every story; TurboSnap (`onlyChanged`) limits snapshots to the
# stories affected by changed files (ADR 0043). Baselines live off-repo and are
# approved by a human in the Chromatic UI (ADR 0043/0046) — no PNG baselines in
# git. This is a separate publish-and-snapshot pass (ADR 0037), distinct from the
# quality gate in ci.yml (which runs the Vitest addon). Action versions are pinned
# to commit SHAs per the ADR 0044 pinning posture.
#
# Bootstrap posture: the snapshot job is INERT until a human provisions the
# Chromatic project token (Phase 11 👤, ADR 0046). Secrets can't be read in a
# job-level `if`, so a tiny `precheck` job exposes "is the token set?" as an output
# the `chromatic` job gates on — the job is *skipped* (not failed) until the token
# exists, so zero CI time is spent during bootstrap and it activates automatically
# once provisioned.
name: Chromatic

on:
  push:
    # Base-branch builds accept baselines for subsequent PR comparisons.
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege: Chromatic reports status through its own GitHub App and the
# project token, not the workflow token.
permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precheck:
    name: Token present?
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - name: Detect Chromatic token (env-reference, ADR 0044)
        id: check
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_PROJECT_TOKEN not set — skipping visual regression (bootstrap; provision in Phase 11)."
          fi

  chromatic:
    name: Chromatic visual regression
    needs: precheck
    if: needs.precheck.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TurboSnap diffs against the git baseline, so the full history is required.
      - name: Checkout (full history for TurboSnap, ADR 0043)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node 24 from .nvmrc (ADR 0004)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish to Chromatic + snapshot (TurboSnap)
        uses: chromaui/action@1db61b73b7919508ee8e62336f04bd0aed6da756 # v17.4.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Reuse the existing static build script (ADR 0035).
          buildScriptName: build-storybook
          # TurboSnap: snapshot only stories touched by changed files (ADR 0043).
          onlyChanged: true
          # Baseline approval is human, in the Chromatic UI (ADR 0043/0046), so a
          # visual change does not redden this job — the Chromatic GitHub-App status
          # check is the gating signal once the project is set up.
          exitZeroOnChanges: true
